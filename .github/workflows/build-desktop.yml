name: Build desktop executables

# Builds a standalone Windows / macOS / Linux executable for every game
# under games/<name>/main.py and attaches them to a GitHub Release.
#
# Publish a release build by tagging a commit and pushing the tag:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# You can also run it manually (Actions tab -> Build desktop executables ->
# Run workflow) to just test that everything still builds, without
# publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-games:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.list.outputs.games }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          games = sorted(
              name for name in os.listdir("games")
              if os.path.isfile(os.path.join("games", name, "main.py"))
          )
          print(f"games={json.dumps(games)}")
          EOF

  build:
    needs: discover-games
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.discover-games.outputs.games) }}
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pygame pyinstaller

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed
          --name ${{ matrix.game }}-${{ runner.os }}
          games/${{ matrix.game }}/main.py

      - name: Zip up bundle-style output (macOS .app etc.)
        shell: bash
        run: |
          cd dist
          for f in ${{ matrix.game }}-${{ runner.os }}*; do
            if [ -d "$f" ]; then
              zip -r "${f}.zip" "$f"
              rm -rf "$f"
            fi
          done
          ls -la

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.game }}-${{ runner.os }}*
