 de tissu bleu. La zèbre la met et se regarde dans un étang. Elle l’aime bien. Pip vole jusqu’à l’étang pour boire. Zaza et la zèbre parlent de leurs nouvelles écharpes. Pip revient et se pose sur un arbre. Il dit que l’arbre est une meilleure chaise : il ne marche pas. Zaza répond : « Merci ! Je veux que mon écharpe reste une écharpe. » Tous rient, et Pip chante une petite chanson dans l’arbre.","Kai ferme le robinet pendant qu’il se brosse les dents. Sa brosse est bleue avec une petite étoile. Sa sœur a une brosse verte. Elle demande si elle peut chanter avec lui demain. Kai dit oui, mais il leur faut deux micros. Papa revient avec un petit verre d’eau pour chaque enfant. Ils se rincent la bouche et rangent leurs brosses. Puis ils vont dans la cuisine pour le petit déjeuner. Leur mère demande pourquoi ils sourient autant. Kai chante la première ligne de sa chanson. Sa sœur chante la ligne suivante. Papa met les mains sur ses oreilles et fait une drôle de tête. Maman rit et dit que c’est une bonne façon de commencer la journée. Kai mange du pain et un fruit. Il dit à sa sœur que demain ils peuvent faire une nouvelle chanson sur le lavage des mains. Elle dit qu’il faut une chanson très courte. Papa dit qu’il est prêt pour une chanson calme. Kai sourit. Pour lui, chanter doucement est peut-être un défi difficile.","Le frère de Ruby regarde depuis un banc. Il a un cerf-volant rouge, mais il ne le fait pas encore voler. Il attend Ruby. Quand elle arrive, elle lui parle du vent. Il dit que le vent aime se reposer un peu, comme les gens. Ruby lui demande de faire voler son cerf-volant aussi. Ils se mettent loin l’un de l’autre pour que les ficelles ne se touchent pas. Le cerf-volant vert monte d’abord. Puis le rouge monte aussi. D’en bas, ils ressemblent à deux petits poissons dans une mer bleue. Une petite fille passe avec sa mère. Elle montre les cerfs-volants et dit qu’un poisson est rouge et l’autre vert. Ruby aime cette idée. Plus tard, le vent devient faible encore une fois. Les deux cerfs-volants descendent. Cette fois, ils tombent sur l’herbe, pas sur le banc. Ruby et son frère rangent les ficelles et rentrent. Ruby dit que les cerfs-volants ont besoin de manger. Son frère dit qu’ils mangent seulement du vent. Ils attendront demain.","La poule s’appelle Dot. D’habitude, elle reste dehors, mais la porte est ouverte aujourd’hui. La mère de Nico donne un petit bol d’eau à Dot. La poule boit et marche dans la cuisine. Le frère de Nico met une petite boîte par terre avec du papier doux dedans. « Tu peux rester ici », dit-il à Dot. Dot regarde la boîte, mais elle retourne sur la chaise. Nico pense qu’elle aime être en haut pour voir tout le monde. Sa mère dit qu’une poule doit vivre dehors, où il y a de la place et de l’air. Nico porte Dot doucement dans le jardin. Son frère prend aussi la boîte. Ils la mettent sous un petit toit pour qu’elle reste sèche. Dot s’assoit enfin dans la boîte. Nico trouve l’œuf sur la chaise et le donne à sa mère. Elle dit qu’elle va le cuire pour midi. À table, Nico regarde la chaise vide et rit. « Il faut mettre une affiche ? » demande-t-il. « Place réservée aux personnes ! »","L’ami de Mia s’appelle Sal. Il a beaucoup de crayons de couleur dans une petite boîte. Il offre un crayon rouge et un vert à Mia. Mia dessine un arbre avec des feuilles vertes. Elle met une pomme rouge dans l’arbre. L’oiseau jaune est sur une branche. Le soleil bleu est haut dans le ciel. Sal demande si elle va maintenant faire un soleil jaune. Mia dit non. C’est son soleil bleu spécial. La maîtresse demande aux enfants de mettre leurs dessins sur une table. Tout le monde regarde les dessins. Un enfant a dessiné un chat violet. Un autre a dessiné une maison rose. La maîtresse dit que l’on peut dessiner des choses réelles ou des choses imaginaires. Mia est contente. À la maison, elle montre le dessin à son père. Il demande pourquoi le soleil est bleu. Mia dit que c’est un soleil frais pour une journée chaude. Son père met le dessin au mur. Le lendemain, Mia apporte tous ses crayons à l’école, même le jaune.","L’amie de Momo est une petite guenon nommée Lulu. Elle lui donne la banane parce qu’elle sait que c’est son fruit préféré. Après le jeu, Momo la remercie encore. Cette fois, tout le monde peut parler. Les singes s’assoient sous un arbre et partagent leur goûter. Momo mange sa banane. Lulu mange une mangue. Un oiseau chante au-dessus d’eux. Momo demande si l’oiseau peut gagner au jeu du silence. Lulu dit non, car l’oiseau chante toute la journée. L’oiseau les regarde et fait un grand bruit, comme s’il était d’accord. Ils décident de jouer à un autre jeu. Chaque singe doit trouver une chose jaune. Momo montre sa peau de banane. Lulu montre une fleur jaune. Un autre singe montre le soleil, mais il est difficile d’apporter le soleil sous l’arbre. Tout le monde rit. À la fin de la journée, Momo rentre chez lui. Il dit à sa mère qu’il a perdu un jeu et gagné un goûter. Elle dit que c’est une très bonne journée."]};

const UI={en:{heroKicker:'Short stories · Big smiles',heroTitle:'Read a little. Laugh a lot.',heroBody:'Choose a funny story, read it, and answer four questions. Switch languages any time to read the same story in French or English.',nameLabel:'Who is reading?',saveNote:'Scores are saved on this browser for each child.',listTitle:'Choose a story',storyCount:'26 stories · A1 level',storyKicker:'A1 reading · 4 questions',readerMeta:'Read the story, then choose one answer for each question.',quizTitle:'Your reading challenge',quizIntro:'Choose one answer for each question. Take your time!',submit:'See my score →',back:'← All stories',notice:'Please answer all four questions first.',resultTitle:'Your score:',perfect:'Amazing reading! You got every answer right. ⭐',good:'Well done! Read the story again to find anything you missed.',again:'Try this story again',all:'All stories',next:'Next story →',answered:'Your answer',correct:'Correct answer',complete:'Your latest score',footer:'One offline file · 26 paired stories · 104 questions per language'},fr:{heroKicker:'Petites histoires · Grands sourires',heroTitle:'Lis un peu. Ris beaucoup.',heroBody:'Choisis une histoire drôle, lis-la et réponds à quatre questions. Change de langue quand tu veux pour lire la même histoire en français ou en anglais.',nameLabel:'Qui lit ?',saveNote:'Les scores de chaque enfant sont enregistrés dans ce navigateur.',listTitle:'Choisis une histoire',storyCount:'26 histoires · Niveau A1',storyKicker:'Lecture A1 · 4 questions',readerMeta:'Lis l’histoire, puis choisis une réponse pour chaque question.',quizTitle:'Ton défi de lecture',quizIntro:'Choisis une réponse pour chaque question. Prends ton temps !',submit:'Voir mon score →',back:'← Toutes les histoires',notice:'Réponds d’abord aux quatre questions.',resultTitle:'Ton score :',perfect:'Bravo ! Toutes tes réponses sont correctes. ⭐',good:'Bien joué ! Relis l’histoire pour trouver les réponses manquées.',again:'Recommencer cette histoire',all:'Toutes les histoires',next:'Histoire suivante →',answered:'Ta réponse',correct:'Bonne réponse',complete:'Ton dernier score',footer:'Un seul fichier hors ligne · 26 histoires bilingues · 104 questions par langue'}};
let language='en',storyIndex=null,player='',choices=[],submitted=false;const KEY='readingQuestScoresV1';const $=id=>document.getElementById(id);function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function scores(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{return {}}}function scoreKey(i){return [player||'Reader',language,i].join('|')}function save(i,n){try{let s=scores();s[scoreKey(i)]={score:n,date:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function currentName(){return $('childName').value.trim()||player|| (language==='en'?'Reader':'Lecteur')}
function ui(){let t=UI[language];document.documentElement.lang=language;document.title=(language==='en'?'Reading Quest':'Défi Lecture')+' · EN/FR';for(let key of ['heroKicker','heroTitle','heroBody','nameLabel','saveNote','listTitle','storyCount','storyKicker','readerMeta','quizTitle','quizIntro','footer'])$(key).textContent=t[key];$('childName').placeholder=language==='en'?'Another name':'Autre prénom';$('back').textContent=t.back;$('submit').textContent=t.submit;$('tryAgain').textContent=t.again;$('allStories').textContent=t.all;$('nextStory').textContent=t.next;for(let lang of ['en','fr']){let b=$(lang+'Button');b.classList.toggle('active',language===lang);b.setAttribute('aria-pressed',String(language===lang))}renderGrid();if(storyIndex!==null)openStory(storyIndex);}
function renderGrid(){let s=scores();$('grid').innerHTML=STORIES.map((o,i)=>{let r=s[scoreKey(i)];let title=escapeHtml(o[language].title);return `<button type="button" class="story-card" data-index="${i}" aria-label="${title}"><span class="emoji" aria-hidden="true">${o.icon}</span><h3>${title}</h3><p>${language==='en'?'A short, funny story with four questions.':'Une courte histoire drôle avec quatre questions.'}</p><span class="badge">${r?escapeHtml(UI[language].complete)+': '+r.score+'/4':'A1 · '+(i+1)+'/26'}</span></button>`}).join('')}
function openStory(i){storyIndex=i;submitted=false;let o=STORIES[i][language],t=UI[language];$('library').classList.add('hidden');$('reader').classList.remove('hidden');$('readerEmoji').textContent=STORIES[i].icon;$('readerTitle').textContent=o.title;$('readerText').innerHTML='<p>'+escapeHtml(o.text)+'</p>';$('notice').textContent='';$('result').classList.add('hidden');$('submit').classList.remove('hidden');choices=o.q.map(q=>shuffle(q.slice(1)));$('questions').innerHTML=o.q.map((q,qi)=>`<div class="question"><h3>${qi+1}. ${escapeHtml(q[0])}</h3><div class="options">${choices[qi].map((answer,ai)=>`<label class="option"><input type="radio" name="q${qi}" value="${ai}" aria-label="${escapeHtml(answer)}"><span>${escapeHtml(answer)}</span></label>`).join('')}</div><div class="info" id="explain${qi}" aria-live="polite"></div></div>`).join('');window.scrollTo({top:0,behavior:'instant'})}
function goLibrary(){storyIndex=null;$('reader').classList.add('hidden');$('library').classList.remove('hidden');renderGrid();window.scrollTo({top:0,behavior:'instant'})}
function submit(e){e.preventDefault();if(submitted)return;let values=choices.map((_,i)=>document.querySelector(`input[name=q${i}]:checked`));if(values.some(v=>!v)){$('notice').textContent=UI[language].notice;return}let n=0,o=STORIES[storyIndex][language],t=UI[language];submitted=true;$('notice').textContent='';values.forEach((v,i)=>{let selected=choices[i][Number(v.value)],correct=o.q[i][1],labels=[...document.querySelectorAll(`input[name=q${i}]`)];if(selected===correct)n++;labels.forEach(input=>{input.disabled=true;if(choices[i][Number(input.value)]===correct)input.closest('.option').classList.add('correct');if(input===v&&selected!==correct)input.closest('.option').classList.add('incorrect')});$('explain'+i).textContent=selected===correct?'✓ '+t.correct+': '+correct:`${t.answered}: ${selected} · ${t.correct}: ${correct}`});save(storyIndex,n);$('resultTitle').textContent=t.resultTitle+' '+n+' / 4';$('resultBody').textContent=n===4?t.perfect:t.good;$('submit').classList.add('hidden');$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('grid').addEventListener('click',e=>{let b=e.target.closest('[data-index]');if(b){player=currentName();openStory(Number(b.dataset.index))}});$('profiles').addEventListener('click',e=>{let b=e.target.closest('[data-name]');if(!b)return;player=b.dataset.name;$('childName').value='';document.querySelectorAll('[data-name]').forEach(x=>x.classList.toggle('selected',x===b));renderGrid()});$('childName').addEventListener('input',()=>{player=$('childName').value.trim();document.querySelectorAll('[data-name]').forEach(x=>x.classList.remove('selected'));renderGrid()});$('enButton').addEventListener('click',()=>{if(language!=='en'){language='en';ui()}});$('frButton').addEventListener('click',()=>{if(language!=='fr'){language='fr';ui()}});$('back').addEventListener('click',goLibrary);$('allStories').addEventListener('click',goLibrary);$('nextStory').addEventListener('click',()=>openStory((storyIndex+1)%STORIES.length));$('tryAgain').addEventListener('click',()=>openStory(storyIndex));$('quizForm').addEventListener('submit',submit);ui();
