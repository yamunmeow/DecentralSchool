<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2e3e72"><title>Reading Quest · English & French</title>
<style>
:root{--ink:#24335a;--muted:#60718a;--blue:#2e3e72;--teal:#087d78;--orange:#f5ae4f;--paper:#fff;--line:#dfe6ef;--good:#e4f7ed;--bad:#ffefed;--shadow:0 13px 35px #20305618}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 4%,#ffecd4,transparent 31%),radial-gradient(circle at 90% 6%,#ddf4ed,transparent 30%),#f8f6f2;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.shell{max-width:1100px;margin:auto;padding:20px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.brand{font-size:1.3rem;font-weight:900;letter-spacing:-.04em}.brand span{display:inline-grid;place-items:center;width:38px;height:38px;background:var(--orange);border-radius:12px;transform:rotate(-8deg);margin-right:7px}.lang-switch{display:flex;gap:4px;background:#e8edf2;padding:5px;border-radius:14px}.lang-switch button{border:0;background:transparent;color:var(--muted);font-weight:850;border-radius:10px;padding:9px 15px}.lang-switch button.active{background:#fff;color:var(--blue);box-shadow:0 3px 8px #20305620}.card{background:var(--paper);border:1px solid #e8eaf0;border-radius:25px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.4fr .6fr;align-items:center;gap:20px;padding:34px 37px;overflow:hidden}.kicker{color:var(--teal);font-weight:850;text-transform:uppercase;font-size:.78rem;letter-spacing:.1em}.hero h1{font-size:clamp(2.05rem,5vw,3.5rem);letter-spacing:-.06em;line-height:1.06;margin:10px 0;color:var(--blue)}.hero p{line-height:1.55;color:var(--muted);margin:0;max-width:55ch}.hero-art{text-align:center;font-size:5.4rem;transform:rotate(-7deg);background:#e5f4ee;border-radius:25px;padding:25px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0;padding:20px 25px}.controls label{font-weight:750}.name{border:2px solid var(--line);border-radius:12px;padding:11px 13px;width:min(230px,100%);color:var(--ink)}.profiles{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 12px;font-weight:800}.chip.selected{border-color:var(--teal);background:#e9f8f3}.info{color:var(--muted);font-size:.85rem}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:27px 2px 13px}.sectionhead h2{font-size:1.45rem;margin:0;letter-spacing:-.03em}.sectionhead span{color:var(--muted);font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.story-card{border:2px solid transparent;text-align:left;padding:20px;background:#fff;border-radius:20px;box-shadow:0 8px 24px #26375e12;color:var(--ink);min-height:185px;transition:.15s}.story-card:hover{transform:translateY(-3px);border-color:#8dcec1}.story-card .emoji{font-size:2.2rem;display:block;margin-bottom:12px}.story-card h3{margin:0 0 8px;font-size:1.08rem;line-height:1.25}.story-card p{color:var(--muted);margin:0;font-size:.86rem;line-height:1.4}.badge{display:inline-block;margin-top:14px;border-radius:99px;background:#eaf4f3;color:#08716a;font-size:.74rem;font-weight:850;padding:5px 9px}.reader{padding:30px 38px}.back{background:transparent;border:0;color:var(--teal);font-weight:850;padding:4px 0;margin-bottom:15px}.reader-header{display:flex;align-items:center;gap:17px}.story-emoji{font-size:3rem;background:#e7f5ef;padding:12px;border-radius:17px}.reader h1{font-size:clamp(1.9rem,4vw,2.8rem);letter-spacing:-.05em;line-height:1.1;margin:4px 0}.meta{color:var(--muted);font-size:.87rem}.story-text{background:#fffaf0;border-left:6px solid var(--orange);padding:23px 25px;border-radius:0 17px 17px 0;margin:25px 0 30px;font-size:clamp(1.13rem,2.3vw,1.32rem);line-height:1.8;max-width:800px}.story-text p{margin:0 0 12px}.story-text p:last-child{margin:0}.quiz h2{font-size:1.45rem;margin:0 0 5px}.quiz-intro{color:var(--muted);margin:0 0 19px}.question{border-top:1px solid var(--line);padding:19px 0 17px}.question h3{font-size:1.04rem;margin:0 0 12px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.option{display:flex;align-items:center;gap:10px;border:2px solid var(--line);padding:11px 14px;border-radius:13px;cursor:pointer;min-height:48px}.option:hover{border-color:#8dcec1}.option:has(input:checked){border-color:var(--teal);background:#e9f8f3}.option input{accent-color:var(--teal);width:17px;height:17px;flex:none}.option.correct{background:var(--good);border-color:#57b98d}.option.incorrect{background:var(--bad);border-color:#e47b70}.primary{border:0;border-radius:14px;background:var(--blue);color:#fff;padding:14px 22px;font-weight:850;box-shadow:0 6px 0 #1b284d}.primary:hover{transform:translateY(-2px)}.secondary{background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--blue);padding:12px 17px;font-weight:850}.secondary:hover{border-color:var(--teal)}.notice{min-height:22px;color:#a53b37;font-weight:700;margin:9px 0}.result{background:#eaf7f1;padding:22px;border-radius:19px;margin-top:21px}.result h2{margin:0 0 7px;font-size:1.55rem}.result p{margin:0;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);font-size:.83rem;margin-top:28px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero-art{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:9px}.story-card{padding:15px;min-height:175px}.story-card .emoji{font-size:1.8rem;margin-bottom:7px}.story-card h3{font-size:.95rem}.reader{padding:23px 18px}.options{grid-template-columns:1fr}.hero{padding:27px 22px}.controls{padding:19px}.top{align-items:flex-start}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span aria-hidden="true">📖</span> Reading Quest</div><nav class="lang-switch" aria-label="Language"><button id="enButton" type="button" class="active" aria-pressed="true">English</button><button id="frButton" type="button" aria-pressed="false">Français</button></nav></header>
<section id="library"><div class="card hero"><div><div class="kicker" id="heroKicker"></div><h1 id="heroTitle"></h1><p id="heroBody"></p></div><div class="hero-art" aria-hidden="true">📚✨</div></div><div class="card controls"><label for="childName" id="nameLabel"></label><div class="profiles" id="profiles"><button class="chip" data-name="Iris" type="button">Iris</button><button class="chip" data-name="Pila" type="button">Pila</button><button class="chip" data-name="Marie-Serge" type="button">Marie-Serge</button></div><input class="name" id="childName" type="text" maxlength="32" autocomplete="off" placeholder="Another name"><span class="info" id="saveNote"></span></div><div class="sectionhead"><h2 id="listTitle"></h2><span id="storyCount"></span></div><div class="grid" id="grid"></div></section>
<section id="reader" class="card reader hidden"><button class="back" id="back" type="button"></button><div class="reader-header"><div class="story-emoji" id="readerEmoji"></div><div><div class="kicker" id="storyKicker"></div><h1 id="readerTitle"></h1><div class="meta" id="readerMeta"></div></div></div><article class="story-text" id="readerText"></article><div class="quiz"><h2 id="quizTitle"></h2><p class="quiz-intro" id="quizIntro"></p><form id="quizForm"><div id="questions"></div><div class="notice" id="notice" role="status"></div><button class="primary" id="submit" type="submit"></button></form><div id="result" class="result hidden" role="status"><h2 id="resultTitle"></h2><p id="resultBody"></p><div class="actions"><button class="primary" id="nextStory" type="button"></button><button class="secondary" id="tryAgain" type="button"></button><button class="secondary" id="allStories" type="button"></button></div></div></div></section><div class="footer" id="footer"></div></main>
<script>
'use strict';
// Each item is a paired story. Every question stores its correct choice first; choices are mixed before display.
const STORIES=[
{icon:'🐱',en:{title:'The Cat in the Hat',text:'Milo is a small cat. He finds a big red hat on the sofa. The hat is too big. Milo walks into the kitchen, but he cannot see. He walks into a chair. The chair is fine. Milo is fine. His hat is on the floor. Now the dog wears it!',q:[['What animal is Milo?','A cat','A dog','A bird'],['What color is the hat?','Red','Blue','Green'],['Where does Milo walk?','Into the kitchen','Into the garden','Into the school'],['Who wears the hat at the end?','The dog','The chair','Milo’s mother']]},fr:{title:'Le chat et le chapeau',text:'Milo est un petit chat. Il trouve un grand chapeau rouge sur le canapé. Le chapeau est trop grand. Milo va dans la cuisine, mais il ne voit rien. Il touche une chaise. La chaise va bien. Milo va bien. Son chapeau est par terre. Maintenant, le chien le porte !',q:[['Milo est quel animal ?','Un chat','Un chien','Un oiseau'],['De quelle couleur est le chapeau ?','Rouge','Bleu','Vert'],['Où va Milo ?','Dans la cuisine','Dans le jardin','À l’école'],['Qui porte le chapeau à la fin ?','Le chien','La chaise','La mère de Milo']]}},
{icon:'🍌',en:{title:'The Banana Phone',text:'Lina has a yellow banana. She puts it next to her ear. “Hello, Grandma!” she says. Grandma is in the room and laughs. “That is a banana, not a phone!” Lina smiles. “I know. But this phone is delicious.” Then she eats it.',q:[['What does Lina put by her ear?','A banana','An apple','A shoe'],['Who is in the room?','Grandma','The teacher','A doctor'],['What does Grandma do?','She laughs','She sleeps','She sings'],['What does Lina do at the end?','She eats the banana','She calls a friend','She goes outside']]},fr:{title:'Le téléphone banane',text:'Lina a une banane jaune. Elle la met près de son oreille. « Allô, Mamie ! » dit-elle. Mamie est dans la pièce et elle rit. « C’est une banane, pas un téléphone ! » Lina sourit. « Je sais. Mais ce téléphone est délicieux. » Puis elle mange la banane.',q:[['Que met Lina près de son oreille ?','Une banane','Une pomme','Une chaussure'],['Qui est dans la pièce ?','Mamie','La maîtresse','Un médecin'],['Que fait Mamie ?','Elle rit','Elle dort','Elle chante'],['Que fait Lina à la fin ?','Elle mange la banane','Elle appelle une amie','Elle sort']]}},
{icon:'🐸',en:{title:'A Frog at School',text:'A green frog sits on Tom’s desk. Tom says, “Good morning!” The frog jumps onto his book. The teacher comes in. Everyone is quiet. Then the frog says, “Ribbit!” The class laughs. The teacher says, “Our new student is very good at jumping.”',q:[['What color is the frog?','Green','Pink','Black'],['Where does it sit first?','On Tom’s desk','Under a tree','On a bus'],['What does it jump onto?','A book','A chair','A bag'],['What is the frog good at?','Jumping','Reading','Singing']]},fr:{title:'Une grenouille à l’école',text:'Une grenouille verte est sur la table de Tom. Tom dit : « Bonjour ! » La grenouille saute sur son livre. La maîtresse arrive. Tout le monde se tait. Puis la grenouille fait : « Croâ ! » La classe rit. La maîtresse dit : « Notre nouvel élève saute très bien. »',q:[['De quelle couleur est la grenouille ?','Verte','Rose','Noire'],['Où est-elle au début ?','Sur la table de Tom','Sous un arbre','Dans un bus'],['Sur quoi saute-t-elle ?','Un livre','Une chaise','Un sac'],['Que fait bien la grenouille ?','Elle saute','Elle lit','Elle chante']]}},
{icon:'🧦',en:{title:'The Missing Sock',text:'Omar has two blue socks. In the morning, he sees only one. He looks under his bed. No sock. He looks in his bag. No sock. His little dog runs into the room. The dog has the blue sock on its head. Omar laughs and takes his sock back.',q:[['How many socks does Omar have?','Two','Three','One'],['Where does he look first?','Under his bed','In the garden','In the kitchen'],['Who has the sock?','His dog','His sister','His teacher'],['Where is the sock on the dog?','On its head','On its tail','On its foot']]},fr:{title:'La chaussette perdue',text:'Omar a deux chaussettes bleues. Le matin, il n’en voit qu’une. Il cherche sous son lit. Pas de chaussette. Il cherche dans son sac. Pas de chaussette. Son petit chien entre dans la chambre. Le chien a la chaussette bleue sur la tête. Omar rit et reprend sa chaussette.',q:[['Combien de chaussettes Omar a-t-il ?','Deux','Trois','Une'],['Où cherche-t-il d’abord ?','Sous son lit','Dans le jardin','Dans la cuisine'],['Qui a la chaussette ?','Son chien','Sa sœur','Sa maîtresse'],['Où est la chaussette sur le chien ?','Sur sa tête','Sur sa queue','Sur son pied']]}},
{icon:'🍕',en:{title:'Pizza for Breakfast',text:'It is Saturday. Dad makes a pizza for breakfast. It has tomato and cheese. Ava puts a little banana on her piece. Dad says, “Banana on pizza?” Ava takes a bite. “Yes! It is sweet and good.” Dad tries it too. He smiles, but Mum wants bread.',q:[['What day is it?','Saturday','Monday','Friday'],['Who makes the pizza?','Dad','Ava','Mum'],['What does Ava add?','Banana','Carrot','Fish'],['What does Mum want?','Bread','Rice','Soup']]},fr:{title:'Une pizza au petit déjeuner',text:'C’est samedi. Papa prépare une pizza pour le petit déjeuner. Il y a de la tomate et du fromage. Ava met un peu de banane sur sa part. Papa dit : « De la banane sur une pizza ? » Ava goûte. « Oui ! C’est sucré et bon. » Papa goûte aussi. Il sourit, mais maman veut du pain.',q:[['Quel jour est-ce ?','Samedi','Lundi','Vendredi'],['Qui prépare la pizza ?','Papa','Ava','Maman'],['Que met Ava sur sa part ?','De la banane','Une carotte','Du poisson'],['Que veut maman ?','Du pain','Du riz','De la soupe']]}},
{icon:'🚲',en:{title:'The Slow Race',text:'Nina and Leo ride their bikes in the park. “Let’s race!” says Leo. Nina rides fast. Leo rides slowly because a duck family crosses the path. Nina stops and waits with him. The ducks go to the pond. Leo and Nina start again. The ducks win the race!',q:[['Where do they ride?','In the park','At school','At the beach'],['Who rides slowly?','Leo','Nina','A duck'],['What crosses the path?','A duck family','A bus','A cat'],['Where do the ducks go?','To the pond','To a shop','To a house']]},fr:{title:'La course lente',text:'Nina et Léo font du vélo dans le parc. « On fait la course ! » dit Léo. Nina va vite. Léo va lentement, car une famille de canards traverse le chemin. Nina s’arrête et attend avec lui. Les canards vont à l’étang. Léo et Nina repartent. Les canards gagnent la course !',q:[['Où font-ils du vélo ?','Dans le parc','À l’école','À la plage'],['Qui va lentement ?','Léo','Nina','Un canard'],['Qui traverse le chemin ?','Une famille de canards','Un bus','Un chat'],['Où vont les canards ?','À l’étang','Dans un magasin','Dans une maison']]}},
{icon:'☔',en:{title:'An Umbrella for the Sun',text:'The sky is blue. The sun is hot. Ben takes an umbrella to the park. His friends say, “There is no rain!” Ben opens it and sits in the shade. Soon his friends sit with him. “Good idea,” they say. Then one small cloud brings rain.',q:[['What is the weather like first?','Hot and sunny','Cold and snowy','Windy and dark'],['What does Ben take?','An umbrella','A coat','A kite'],['Why do his friends sit with him?','For shade','For lunch','For a song'],['What happens at the end?','It rains','It snows','The sun goes away forever']]},fr:{title:'Un parapluie pour le soleil',text:'Le ciel est bleu. Il fait chaud. Ben prend un parapluie pour aller au parc. Ses amis disent : « Il ne pleut pas ! » Ben l’ouvre et s’assoit à l’ombre. Bientôt, ses amis s’assoient avec lui. « Bonne idée », disent-ils. Puis un petit nuage apporte la pluie.',q:[['Quel temps fait-il au début ?','Il fait chaud et beau','Il neige et il fait froid','Il y a du vent et il fait noir'],['Que prend Ben ?','Un parapluie','Un manteau','Un cerf-volant'],['Pourquoi ses amis s’assoient-ils avec lui ?','Pour être à l’ombre','Pour déjeuner','Pour chanter'],['Que se passe-t-il à la fin ?','Il pleut','Il neige','Le soleil disparaît pour toujours']]}},
{icon:'🐢',en:{title:'Turtle’s Big Day',text:'Titi the turtle wants to visit her friend. Her friend lives next to a big tree. Titi walks all morning. At lunch, she sees the tree. “I am here!” she says. Her friend comes out. It is another turtle. “You are early,” says her friend. “I am early?” Titi laughs.',q:[['What animal is Titi?','A turtle','A rabbit','A fish'],['Where does her friend live?','Next to a big tree','In a school','Under a bridge'],['When does Titi see the tree?','At lunch','At night','At breakfast'],['What does her friend say?','You are early','You are late','Go home']]},fr:{title:'La grande journée de Titi',text:'Titi la tortue veut voir son amie. Son amie habite près d’un grand arbre. Titi marche toute la matinée. À midi, elle voit l’arbre. « Je suis là ! » dit-elle. Son amie sort. C’est une autre tortue. « Tu es en avance », dit son amie. « En avance, moi ? » Titi rit.',q:[['Titi est quel animal ?','Une tortue','Un lapin','Un poisson'],['Où habite son amie ?','Près d’un grand arbre','Dans une école','Sous un pont'],['Quand Titi voit-elle l’arbre ?','À midi','La nuit','Au petit déjeuner'],['Que dit son amie ?','Tu es en avance','Tu es en retard','Rentre chez toi']]}},
{icon:'🎂',en:{title:'The Surprise Cake',text:'It is Jo’s birthday. His sister makes a small cake. She puts five candles on it. Jo closes his eyes and makes a wish. When he opens his eyes, the cat is near the cake. There is no cream on top. The cat has cream on its nose. “Happy birthday, cat!” says Jo.',q:[['Whose birthday is it?','Jo’s','His sister’s','The cat’s'],['How many candles are there?','Five','Four','Six'],['What is missing from the cake?','Cream','Candles','Chocolate'],['Where is the cream?','On the cat’s nose','On the floor','On Jo’s hat']]},fr:{title:'Le gâteau surprise',text:'C’est l’anniversaire de Jo. Sa sœur prépare un petit gâteau. Elle met cinq bougies dessus. Jo ferme les yeux et fait un vœu. Quand il ouvre les yeux, le chat est près du gâteau. Il n’y a plus de crème dessus. Le chat a de la crème sur le nez. « Joyeux anniversaire, chat ! » dit Jo.',q:[['C’est l’anniversaire de qui ?','Jo','Sa sœur','Le chat'],['Combien de bougies y a-t-il ?','Cinq','Quatre','Six'],['Que manque-t-il sur le gâteau ?','La crème','Les bougies','Le chocolat'],['Où est la crème ?','Sur le nez du chat','Par terre','Sur le chapeau de Jo']]}},
{icon:'🐘',en:{title:'The Elephant’s Shoes',text:'Eli the elephant has four new shoes. They are bright yellow. He walks to the river to show his friends. A fish looks at his feet and says, “Nice shoes!” Eli smiles. Then he steps into the water. His shoes float away. The fish says, “Nice boats!”',q:[['How many shoes does Eli have?','Four','Two','Six'],['What color are they?','Yellow','Red','Blue'],['Where does Eli go?','To the river','To school','To a shop'],['What happens to the shoes?','They float away','They grow','They disappear in a bag']]},fr:{title:'Les chaussures de l’éléphant',text:'Eli l’éléphant a quatre nouvelles chaussures. Elles sont jaune vif. Il va à la rivière pour les montrer à ses amis. Un poisson regarde ses pieds et dit : « Belles chaussures ! » Eli sourit. Puis il entre dans l’eau. Ses chaussures flottent et partent. Le poisson dit : « Beaux bateaux ! »',q:[['Combien de chaussures Eli a-t-il ?','Quatre','Deux','Six'],['De quelle couleur sont-elles ?','Jaunes','Rouges','Bleues'],['Où va Eli ?','À la rivière','À l’école','Dans un magasin'],['Que font les chaussures ?','Elles flottent et partent','Elles grandissent','Elles vont dans un sac']]}},
{icon:'🥕',en:{title:'The Carrot King',text:'A rabbit finds a very big carrot in the garden. It is bigger than his head. He puts it on his head like a crown. “I am the carrot king!” he says. His sister laughs. “A king must share,” she says. The rabbit cuts the carrot in two. They eat together.',q:[['What does the rabbit find?','A big carrot','A small apple','A blue hat'],['Where does he put it?','On his head','In a box','Under the bed'],['Who speaks to him?','His sister','His teacher','A duck'],['What do they do at the end?','They share the carrot','They sell it','They plant it']]},fr:{title:'Le roi carotte',text:'Un lapin trouve une très grosse carotte dans le jardin. Elle est plus grande que sa tête. Il la met sur sa tête comme une couronne. « Je suis le roi carotte ! » dit-il. Sa sœur rit. « Un roi doit partager », dit-elle. Le lapin coupe la carotte en deux. Ils mangent ensemble.',q:[['Que trouve le lapin ?','Une grosse carotte','Une petite pomme','Un chapeau bleu'],['Où met-il la carotte ?','Sur sa tête','Dans une boîte','Sous le lit'],['Qui lui parle ?','Sa sœur','Sa maîtresse','Un canard'],['Que font-ils à la fin ?','Ils partagent la carotte','Ils la vendent','Ils la plantent']]}},
{icon:'🚌',en:{title:'The Wrong Bus',text:'Maya wants to go to the library. She gets on a bus with a picture of a book. But it is not a library bus. It is a bus for a book shop! The driver smiles. “The library is across the street.” Maya buys no books. She crosses the street and finds the library.',q:[['Where does Maya want to go?','To the library','To the beach','To the zoo'],['What picture is on the bus?','A book','A cat','A star'],['Where does the bus go?','To a book shop','To a hospital','To a school'],['Where is the library?','Across the street','Behind the park','On the bus']]},fr:{title:'Le mauvais bus',text:'Maya veut aller à la bibliothèque. Elle monte dans un bus avec l’image d’un livre. Mais ce n’est pas un bus pour la bibliothèque. Il va à une librairie ! Le chauffeur sourit. « La bibliothèque est de l’autre côté de la rue. » Maya n’achète pas de livre. Elle traverse la rue et trouve la bibliothèque.',q:[['Où Maya veut-elle aller ?','À la bibliothèque','À la plage','Au zoo'],['Quelle image est sur le bus ?','Un livre','Un chat','Une étoile'],['Où va le bus ?','À une librairie','À un hôpital','À une école'],['Où est la bibliothèque ?','De l’autre côté de la rue','Derrière le parc','Dans le bus']]}},
{icon:'🌙',en:{title:'The Moon Is Late',text:'Sam looks out of the window at night. He cannot see the moon. “Is the moon late?” he asks his dad. Dad looks up. A big cloud is in front of the moon. The wind moves the cloud. Now the moon is there. “Hello, moon! You are on time,” says Sam.',q:[['When does Sam look outside?','At night','At lunch','In the morning'],['What can he not see?','The moon','A tree','A car'],['What is in front of the moon?','A cloud','A bird','A house'],['What moves the cloud?','The wind','Dad','Sam']]},fr:{title:'La lune est en retard',text:'Sam regarde par la fenêtre la nuit. Il ne voit pas la lune. « La lune est en retard ? » demande-t-il à papa. Papa regarde le ciel. Un gros nuage est devant la lune. Le vent pousse le nuage. Maintenant, la lune est là. « Bonjour, lune ! Tu es à l’heure », dit Sam.',q:[['Quand Sam regarde-t-il dehors ?','La nuit','À midi','Le matin'],['Que ne voit-il pas ?','La lune','Un arbre','Une voiture'],['Qu’y a-t-il devant la lune ?','Un nuage','Un oiseau','Une maison'],['Qu’est-ce qui pousse le nuage ?','Le vent','Papa','Sam']]}},
{icon:'🐟',en:{title:'A Fish Named Bird',text:'Nora has a little fish. Its name is Bird. Bird lives in a round bowl. Nora says, “Bird, can you fly?” Bird swims up and down. “No, but you can dance,” says Nora. Her brother says, “Why is a fish called Bird?” Nora says, “Because it is funny!”',q:[['What pet does Nora have?','A fish','A bird','A cat'],['What is its name?','Bird','Dance','Blue'],['Where does it live?','In a round bowl','In a tree','In a box'],['What can the fish do?','Swim up and down','Fly over a house','Talk to her brother']]},fr:{title:'Un poisson nommé Oiseau',text:'Nora a un petit poisson. Il s’appelle Oiseau. Oiseau vit dans un bocal rond. Nora dit : « Oiseau, tu peux voler ? » Oiseau nage en haut et en bas. « Non, mais tu peux danser », dit Nora. Son frère dit : « Pourquoi ce poisson s’appelle Oiseau ? » Nora répond : « Parce que c’est drôle ! »',q:[['Quel animal Nora a-t-elle ?','Un poisson','Un oiseau','Un chat'],['Comment s’appelle-t-il ?','Oiseau','Danse','Bleu'],['Où vit-il ?','Dans un bocal rond','Dans un arbre','Dans une boîte'],['Que peut faire le poisson ?','Nager en haut et en bas','Voler au-dessus d’une maison','Parler au frère de Nora']]}},
{icon:'👟',en:{title:'Two Different Shoes',text:'Paul gets dressed very fast. He goes to school. His friend points at his feet. One shoe is black. The other shoe is white. Paul looks down and laughs. “My shoes are playing a game,” he says. After school, he finds the other two shoes at home.',q:[['Where does Paul go?','To school','To the zoo','To the market'],['What color is one shoe?','Black','Green','Yellow'],['What color is the other shoe?','White','Red','Blue'],['Where are the other shoes?','At home','In a bus','In a tree']]},fr:{title:'Deux chaussures différentes',text:'Paul s’habille très vite. Il va à l’école. Son ami montre ses pieds. Une chaussure est noire. L’autre est blanche. Paul regarde et rit. « Mes chaussures jouent à un jeu », dit-il. Après l’école, il trouve les deux autres chaussures à la maison.',q:[['Où va Paul ?','À l’école','Au zoo','Au marché'],['De quelle couleur est une chaussure ?','Noire','Verte','Jaune'],['De quelle couleur est l’autre ?','Blanche','Rouge','Bleue'],['Où sont les autres chaussures ?','À la maison','Dans un bus','Dans un arbre']]}},
{icon:'🍉',en:{title:'The Watermelon Hat',text:'It is a hot day. Dad cuts a watermelon. Amir eats a big piece. The green skin is like a little boat. Amir puts it on his head. “Look! A watermelon hat!” Dad laughs. “Take it off before we go to the shop.” Amir says, “But everyone will want one!”',q:[['What does Dad cut?','A watermelon','An orange','A cake'],['What is the weather like?','Hot','Cold','Rainy'],['What does Amir put on his head?','The green skin','A plate','A toy boat'],['Where do they plan to go?','To the shop','To school','To the river']]},fr:{title:'Le chapeau pastèque',text:'Il fait chaud. Papa coupe une pastèque. Amir mange une grosse part. La peau verte ressemble à un petit bateau. Amir la met sur sa tête. « Regarde ! Un chapeau pastèque ! » Papa rit. « Enlève-le avant d’aller au magasin. » Amir dit : « Mais tout le monde va en vouloir un ! »',q:[['Que coupe papa ?','Une pastèque','Une orange','Un gâteau'],['Quel temps fait-il ?','Il fait chaud','Il fait froid','Il pleut'],['Que met Amir sur sa tête ?','La peau verte','Une assiette','Un petit bateau'],['Où veulent-ils aller ?','Au magasin','À l’école','À la rivière']]}},
{icon:'🦜',en:{title:'The Parrot Says No',text:'A parrot lives with Ana. Every day Ana says, “Good morning!” The parrot says, “No!” Ana asks, “Do you want an apple?” The parrot says, “No!” But it eats the apple. One day Ana says, “Do you want to clean your cage?” The parrot says, “Good morning!”',q:[['Who lives with Ana?','A parrot','A rabbit','A horse'],['What word does it often say?','No','Yes','Please'],['What fruit does it eat?','An apple','A banana','A pear'],['What does Ana ask it to clean?','Its cage','The kitchen','A window']]},fr:{title:'Le perroquet dit non',text:'Un perroquet vit avec Ana. Chaque jour, Ana dit : « Bonjour ! » Le perroquet dit : « Non ! » Ana demande : « Tu veux une pomme ? » Le perroquet dit : « Non ! » Mais il mange la pomme. Un jour, Ana dit : « Tu veux nettoyer ta cage ? » Le perroquet dit : « Bonjour ! »',q:[['Qui vit avec Ana ?','Un perroquet','Un lapin','Un cheval'],['Quel mot dit-il souvent ?','Non','Oui','Merci'],['Quel fruit mange-t-il ?','Une pomme','Une banane','Une poire'],['Qu’est-ce qu’Ana lui demande de nettoyer ?','Sa cage','La cuisine','Une fenêtre']]}},
{icon:'🎒',en:{title:'A Bag Full of Socks',text:'Ema is ready for school. Her bag is very heavy. She opens it in class. There are ten socks inside! There is no book. Her little brother put the socks in the bag. Ema laughs. The teacher gives her paper. At home, Ema gives the socks back to her brother.',q:[['Where is Ema going?','To school','To the beach','To the park'],['How many socks are in the bag?','Ten','Two','Five'],['What is not in the bag?','A book','Socks','Her lunch'],['Who put the socks there?','Her little brother','Her teacher','Her friend']]},fr:{title:'Un sac plein de chaussettes',text:'Ema est prête pour l’école. Son sac est très lourd. Elle l’ouvre en classe. Il y a dix chaussettes dedans ! Il n’y a pas de livre. Son petit frère a mis les chaussettes dans le sac. Ema rit. La maîtresse lui donne du papier. À la maison, Ema rend les chaussettes à son frère.',q:[['Où va Ema ?','À l’école','À la plage','Au parc'],['Combien de chaussettes sont dans le sac ?','Dix','Deux','Cinq'],['Qu’est-ce qui manque dans le sac ?','Un livre','Des chaussettes','Son repas'],['Qui a mis les chaussettes dedans ?','Son petit frère','Sa maîtresse','Son amie']]}},
{icon:'🐓',en:{title:'The Sleepy Rooster',text:'A rooster lives on a farm. Every morning, he calls, “Cock-a-doodle-doo!” Today he is sleepy. He says nothing. The farmer wakes up late. The cows wait for breakfast. At noon, the rooster opens one eye and calls. The cows say, “Good afternoon!”',q:[['Where does the rooster live?','On a farm','In a city flat','At the beach'],['How does he feel today?','Sleepy','Angry','Hungry'],['Who wakes up late?','The farmer','The cows','A child'],['When does the rooster call?','At noon','At midnight','At breakfast']]},fr:{title:'Le coq fatigué',text:'Un coq vit dans une ferme. Chaque matin, il chante : « Cocorico ! » Aujourd’hui, il a sommeil. Il ne chante pas. Le fermier se réveille tard. Les vaches attendent leur repas. À midi, le coq ouvre un œil et chante. Les vaches disent : « Bon après-midi ! »',q:[['Où vit le coq ?','Dans une ferme','Dans un appartement','À la plage'],['Comment se sent-il aujourd’hui ?','Il a sommeil','Il est en colère','Il a faim'],['Qui se réveille tard ?','Le fermier','Les vaches','Un enfant'],['Quand le coq chante-t-il ?','À midi','À minuit','Au petit déjeuner']]}},
{icon:'🍦',en:{title:'Ice Cream for a Dog',text:'It is a warm afternoon. Sira buys strawberry ice cream. Her dog looks at it. “This is mine,” says Sira. She buys a small cup of water for the dog. The dog drinks it happily. Sira takes one bite of her ice cream. Oh no! It falls on her shoe.',q:[['What flavor is the ice cream?','Strawberry','Vanilla','Chocolate'],['What does the dog drink?','Water','Milk','Juice'],['What does Sira do with the ice cream?','She takes one bite','She gives it all to the dog','She puts it in a bag'],['Where does it fall?','On her shoe','On the dog','In the cup']]},fr:{title:'Une glace pour le chien',text:'C’est un après-midi chaud. Sira achète une glace à la fraise. Son chien regarde la glace. « Elle est pour moi », dit Sira. Elle achète un petit gobelet d’eau pour le chien. Le chien boit avec plaisir. Sira mange un peu de sa glace. Oh non ! La glace tombe sur sa chaussure.',q:[['Quel est le parfum de la glace ?','Fraise','Vanille','Chocolat'],['Que boit le chien ?','De l’eau','Du lait','Du jus'],['Que fait Sira avec sa glace ?','Elle en mange un peu','Elle donne tout au chien','Elle la met dans un sac'],['Où tombe la glace ?','Sur sa chaussure','Sur le chien','Dans le gobelet']]}},
{icon:'🦒',en:{title:'The Giraffe’s Scarf',text:'Zaza the giraffe has a long neck. Her friend makes a blue scarf for her. It is very long. Zaza puts it on, but a little bird sits on the scarf. “Is this a new nest?” asks the bird. “No, it is my scarf,” says Zaza. “You can sit here for one minute.”',q:[['What animal is Zaza?','A giraffe','A zebra','A goat'],['What color is the scarf?','Blue','Yellow','Pink'],['Who sits on the scarf?','A little bird','A cat','A frog'],['How long may the bird sit there?','One minute','One day','One week']]},fr:{title:'L’écharpe de la girafe',text:'Zaza la girafe a un long cou. Son amie fait une écharpe bleue pour elle. Elle est très longue. Zaza la met, mais un petit oiseau se pose sur l’écharpe. « C’est un nouveau nid ? » demande l’oiseau. « Non, c’est mon écharpe », dit Zaza. « Tu peux rester ici une minute. »',q:[['Zaza est quel animal ?','Une girafe','Un zèbre','Une chèvre'],['De quelle couleur est l’écharpe ?','Bleue','Jaune','Rose'],['Qui se pose sur l’écharpe ?','Un petit oiseau','Un chat','Une grenouille'],['Combien de temps peut-il rester ?','Une minute','Un jour','Une semaine']]}},
{icon:'🪥',en:{title:'The Toothbrush Song',text:'Kai brushes his teeth every morning. Today he sings a song while he brushes. His sister hears him. “Why are you singing?” she asks. Kai says, “My toothbrush is a microphone!” He sings so loudly that Dad comes to the door. Dad says, “Good song. Now rinse your mouth.”',q:[['What does Kai do every morning?','Brush his teeth','Wash the car','Feed a cat'],['What does he use as a microphone?','His toothbrush','A spoon','A pencil'],['Who hears him first?','His sister','His dad','His teacher'],['What does Dad tell him to do?','Rinse his mouth','Go to bed','Eat cake']]},fr:{title:'La chanson de la brosse à dents',text:'Kai se brosse les dents chaque matin. Aujourd’hui, il chante en se brossant les dents. Sa sœur l’entend. « Pourquoi tu chantes ? » demande-t-elle. Kai dit : « Ma brosse à dents est un micro ! » Il chante si fort que papa arrive à la porte. Papa dit : « Belle chanson. Maintenant, rince-toi la bouche. »',q:[['Que fait Kai chaque matin ?','Il se brosse les dents','Il lave la voiture','Il nourrit un chat'],['Que prend-il pour un micro ?','Sa brosse à dents','Une cuillère','Un crayon'],['Qui l’entend en premier ?','Sa sœur','Son papa','Sa maîtresse'],['Que lui dit papa de faire ?','De se rincer la bouche','D’aller dormir','De manger un gâteau']]}},
{icon:'🪁',en:{title:'The Kite That Sat Down',text:'Ruby has a green kite. She runs in the park. The kite flies high. Then the wind stops. The kite comes down and lands on a bench. Ruby sits next to it. “Are you tired?” she asks. The wind comes back. The kite flies again. Ruby runs after it.',q:[['What color is the kite?','Green','Orange','Purple'],['Where does Ruby run?','In the park','At school','On a farm'],['Where does the kite land?','On a bench','In a lake','On a bus'],['Why does it come down?','The wind stops','It is dark','Ruby cuts the string']]},fr:{title:'Le cerf-volant se repose',text:'Ruby a un cerf-volant vert. Elle court dans le parc. Le cerf-volant vole haut. Puis le vent s’arrête. Le cerf-volant descend et tombe sur un banc. Ruby s’assoit près de lui. « Tu es fatigué ? » demande-t-elle. Le vent revient. Le cerf-volant vole encore. Ruby court derrière lui.',q:[['De quelle couleur est le cerf-volant ?','Vert','Orange','Violet'],['Où court Ruby ?','Dans le parc','À l’école','Dans une ferme'],['Où tombe le cerf-volant ?','Sur un banc','Dans un lac','Sur un bus'],['Pourquoi descend-il ?','Le vent s’arrête','Il fait noir','Ruby coupe la ficelle']]}},
{icon:'🥚',en:{title:'The Egg on the Chair',text:'Nico sees an egg on a chair in the kitchen. “Who put it there?” he asks. His mother says, “Not me.” His brother says, “Not me.” The chicken walks in through the open door. She sits on the chair. “Oh,” says Nico. “It is your chair!”',q:[['What is on the chair?','An egg','A book','A banana'],['Where is the chair?','In the kitchen','In the garden','At school'],['Who comes through the door?','A chicken','A dog','A duck'],['Who sits on the chair?','The chicken','Nico','His brother']]},fr:{title:'L’œuf sur la chaise',text:'Nico voit un œuf sur une chaise dans la cuisine. « Qui l’a mis là ? » demande-t-il. Sa mère dit : « Pas moi. » Son frère dit : « Pas moi. » La poule entre par la porte ouverte. Elle s’assoit sur la chaise. « Ah », dit Nico. « C’est ta chaise ! »',q:[['Qu’y a-t-il sur la chaise ?','Un œuf','Un livre','Une banane'],['Où est la chaise ?','Dans la cuisine','Dans le jardin','À l’école'],['Qui entre par la porte ?','Une poule','Un chien','Un canard'],['Qui s’assoit sur la chaise ?','La poule','Nico','Son frère']]}},
{icon:'🎨',en:{title:'The Blue Sun',text:'At school, Mia draws a blue sun. Her friend asks, “Why is the sun blue?” Mia says, “I only have a blue pencil.” The teacher gives her a yellow pencil. Mia draws a yellow bird next to the blue sun. “Now the bird has the sun’s color,” she says. Everyone laughs.',q:[['What does Mia draw first?','A blue sun','A yellow tree','A red bird'],['Why is it blue?','She has only a blue pencil','The sky is blue','She likes rain'],['What does the teacher give her?','A yellow pencil','A red pen','A book'],['What does she draw next?','A yellow bird','A green house','A blue dog']]},fr:{title:'Le soleil bleu',text:'À l’école, Mia dessine un soleil bleu. Son ami demande : « Pourquoi le soleil est bleu ? » Mia dit : « Je n’ai qu’un crayon bleu. » La maîtresse lui donne un crayon jaune. Mia dessine un oiseau jaune à côté du soleil bleu. « Maintenant, l’oiseau a la couleur du soleil », dit-elle. Tout le monde rit.',q:[['Que dessine Mia d’abord ?','Un soleil bleu','Un arbre jaune','Un oiseau rouge'],['Pourquoi est-il bleu ?','Elle n’a qu’un crayon bleu','Le ciel est bleu','Elle aime la pluie'],['Que lui donne la maîtresse ?','Un crayon jaune','Un stylo rouge','Un livre'],['Que dessine-t-elle ensuite ?','Un oiseau jaune','Une maison verte','Un chien bleu']]}},
{icon:'🐒',en:{title:'Monkey’s Quiet Game',text:'Momo the monkey plays a quiet game with his friends. No one can make a sound. A bird sings. Momo smiles but stays quiet. A leaf falls on his nose. He wants to laugh. Then his friend gives him a banana. “Thank you!” says Momo. His friends clap. He loses the game, but wins a snack.',q:[['What animal is Momo?','A monkey','A bird','A lion'],['What kind of game do they play?','A quiet game','A running game','A ball game'],['What falls on his nose?','A leaf','A banana','A hat'],['Why does he lose?','He says thank you','He falls down','He eats the leaf']]},fr:{title:'Le jeu du silence',text:'Momo le singe joue au jeu du silence avec ses amis. Personne ne doit faire de bruit. Un oiseau chante. Momo sourit, mais reste silencieux. Une feuille tombe sur son nez. Il veut rire. Puis son ami lui donne une banane. « Merci ! » dit Momo. Ses amis applaudissent. Il perd le jeu, mais gagne un goûter.',q:[['Momo est quel animal ?','Un singe','Un oiseau','Un lion'],['À quel jeu jouent-ils ?','Au jeu du silence','À la course','Au ballon'],['Qu’est-ce qui tombe sur son nez ?','Une feuille','Une banane','Un chapeau'],['Pourquoi perd-il ?','Il dit merci','Il tombe','Il mange la feuille']]}}
];
const EXPANSIONS={"en":["The dog walks proudly into the living room. His name is Bobo, and he likes to carry things. He does not know that a hat is for a head. He thinks it is a soft little house. Milo follows him. Bobo goes under the table, but the hat is too wide. It stays outside the table. Bobo looks surprised. Milo sits beside the hat. Their little friend Nora comes home from school. She sees the red hat and the two animals. “Is this a new game?” she asks. Milo touches the hat with one paw. Bobo touches it with his nose. Nora puts the hat on her own head. It fits her well. She can see the sofa, the kitchen, and the chair. “This hat is mine,” she says with a smile. Bobo brings her a ball. Milo brings her a sock. Now everyone wants to give Nora a present. The chair, of course, gives nothing. It has had enough excitement for one day.","Lina's little brother wants to try the banana phone too. He takes an orange from the table and says, “Hello, Grandpa!” Grandpa is outside in the garden. He cannot hear the orange, but he can hear the boy. He comes inside and asks, “Who is calling me?” Grandma points to the orange. Everyone laughs. Lina says that a fruit phone has a very short battery life. Her brother does not understand. “Where is the battery?” he asks. Lina shows him the empty banana skin. “There is no battery now. I ate it!” Grandma takes a real phone from her pocket and shows them a photo of Grandpa's flowers. Grandpa has many red flowers. The children run to the window to see them. Then Grandpa asks for his orange back. He is hungry. Lina's brother gives it to him and says, “You have a call from your stomach.” Grandpa laughs and shares the orange with the children. Lina puts the orange peel in the bin and washes her hands.","Tom asks the teacher if the new student can sit next to him. The teacher says that frogs do not usually come to school, but this one can stay until the end of the morning. The class is learning about numbers. Tom puts three pencils on his desk. The frog jumps over the first pencil, then the second, then the third. “One, two, three!” the children say. The frog does not count, but it looks very happy. At break time, Tom takes it outside. There is a little pond behind the school. The frog sees the water and jumps in. Tom waves goodbye. In the afternoon, the teacher asks everyone to draw what happened. Tom draws a green frog with a very large school bag. His friend draws a frog with glasses. The teacher puts both pictures on the wall. The next morning, Tom looks at his desk. There is no frog, only a small wet mark. He smiles anyway.","The dog's name is Pip. Pip likes blue things. He has a blue ball and a blue blanket. Today he thinks the sock is a blue winter hat. Omar says, “Pip, a sock goes on my foot, not on your head.” Pip runs away with his new hat. Omar follows him into the living room. His sister sees them and laughs. She has a camera and takes a picture. In the picture, Pip looks like a very small chef with a very soft hat. Omar finally gets the sock back. It is clean, but it has dog hair on it. He puts it beside the other sock and looks at the two. Pip brings his blue ball to Omar. He wants to play before breakfast. Omar has five minutes, so they play together. Then Omar gets dressed. His sister shows the funny photo to their mother. Mother says, “Tomorrow, look for your socks on Pip first.” Pip wags his tail. He does not understand, but he loves the attention.","Ava's little brother comes to the table. He wants to put an apple on his pizza. Dad says, “One new idea at a time, please.” The little boy eats his piece with only cheese. Mum makes toast and sits with them. She asks Ava why she likes banana on pizza. Ava says that banana is soft and sweet. Tomato is soft too, but it is not sweet. She likes the two tastes together. Dad cuts one very small piece for Mum. Mum tries it. She makes a funny face, then takes another bite. “It is interesting,” she says. That is not the same as “I love it,” and everyone knows it. After breakfast, the family cleans the table. Ava writes “banana pizza” on a piece of paper. She puts it on the fridge. Her brother writes “apple pizza” under it. Dad reads both ideas and shakes his head. Next Saturday, he may make eggs instead.","At the pond, the mother duck looks back at her little ducks. There are four of them. One duck is very small and walks slowly. Nina counts them with her finger. Leo puts his bike beside a tree so the ducks have a lot of space. Two other children come along the path. They want to go fast too. Nina asks them to wait. The children stop and watch the ducks. The little duck walks after its mother and finally reaches the water. Everyone smiles. Leo says, “This is the slowest race in the world.” Nina says, “Yes, and I like it.” They get on their bikes again. This time they do not race. They ride side by side and talk about the ducks. At home, Nina tells her father that she lost a race to a family of ducks. Her father laughs and asks for a photo. Nina has no photo, but she can draw four little ducks and one big duck for him.","The rain is light, so Ben and his friends stay under the umbrella. They can hear little drops on top of it. One friend says it sounds like tiny feet. Another friend says it sounds like popcorn. Ben says it sounds like rain, and they all laugh. A woman walks by with no umbrella. The children move closer together and make room for her. She thanks them. After a few minutes, the cloud moves away. The sun comes back, and the umbrella gives them shade again. “Your umbrella has two jobs today,” says the woman. Ben is pleased. He walks home with the umbrella closed. At home, his sister asks if he went swimming. His shoes are wet, but the rest of his clothes are dry. He tells her about the sunny day, the rain, the popcorn sound, and the new friend. His sister asks to take the umbrella to the park tomorrow. Ben says yes, if she remembers to bring it home.","Titi's friend is called Lili. Lili has a little garden by the tree. She grows green leaves and small yellow flowers. Titi brings one red flower as a gift. She carried it all morning, so it is a little tired too. Lili puts the flower in a cup of water. Then the two friends have lunch. They eat leaves slowly and tell stories. Titi says she saw a fast rabbit on the road. The rabbit ran past her in one second. Lili says she saw the same rabbit three times this morning. “He is fast, but he does not know where he wants to go,” she says. In the afternoon, Titi and Lili sit in the shade. The rabbit runs by again. “Hello!” they call. He stops, surprised to see them together. He asks if he is late. Lili says, “No. Sit down. We have time.” Even the rabbit is quiet for a moment.","Jo's sister looks at the cat. The cat is called Pumpkin, but it is not orange. It is white with one black ear. Pumpkin sits very still and looks innocent. Jo's sister takes a clean spoon and puts a little cream on the cake. She does not have much cream left. Jo puts the candles back in place. His family sings a birthday song. Pumpkin looks at the candles but stays far away from them. Jo blows them out. His wish is a secret. They cut the cake into small pieces. Jo gives his sister the first piece because she made it. His parents get pieces too. Pumpkin gets a bowl of cat food, not cake. “This is your birthday dinner,” Jo tells him. After the party, Jo draws a picture of Pumpkin with a big cream nose. He puts it on the fridge. His sister writes the date below the picture. Next year, they will keep the cake far from the cat.","Eli looks at the water. His shoes are going down the river very slowly. The fish swims next to one yellow shoe. A small frog jumps on the other shoe. “I have a boat!” says the frog. Eli walks along the river, but he cannot go into deep water. His friend, a long bird, flies above the shoes. The bird lands on the bank farther down and waits. There is a little bridge there. The shoes stop near the bridge. The frog jumps onto a stone, and the fish pushes one shoe close to Eli. Eli takes both shoes out of the water. They are wet, but still bright yellow. He thanks his friends. He puts the shoes in the sun to dry. While he waits, he stands with his big feet on the soft grass. “Maybe I do not need shoes today,” he says. The frog asks if it can use one shoe as a boat tomorrow. Eli says, “Only if you bring it back!”","The rabbit's sister is called Mimi. Mimi takes her half of the carrot and washes it in a little stream. The rabbit washes his half too. They sit under a tree to eat. A bird comes down and asks what a carrot king does all day. “He finds lunch,” says the rabbit. “And he shares it,” says Mimi. The bird does not like carrots, but it likes the story. It flies away to tell the other birds about the king with a vegetable crown. Soon two mice arrive. They ask to see the crown. The rabbit shows them the top of the carrot, with green leaves still on it. The mice laugh. It is a very small crown now. The rabbit puts it back on his head, but it falls over one ear. Mimi says, “A small king can still be kind.” The rabbit smiles. He decides that tomorrow he will look for a large cabbage. It may make a better hat, but he will not eat it alone.","Inside the library, Maya sees many books. A woman at the desk asks if she needs help. Maya says she wants a funny story about animals. The woman shows her a shelf with short books. Maya chooses one about a cow that wants to dance. She sits by a window and reads the first page. The cow has four feet and no shoes. Maya laughs quietly. She remembers that people must be quiet in a library. After reading, she puts the book in her bag. She has a library card, so she can take it home. On her way back, she sees the book bus again. The driver waves. Maya waves back. She tells him she found the right place. At home, she tells her brother about the two places: a shop sells books, and a library lets people borrow them. Her brother asks if a cow can really dance. Maya opens the book and says, “Let's find out together.”","Dad brings a chair to the window. Sam sits on it with a soft blanket. The moon looks round and bright now. Sam says it looks like a white plate in the sky. Dad says the moon changes shape in the sky. Some nights it looks like a small piece of a plate. Sam wonders who uses the rest of the plate. Dad smiles and says no one has a sky kitchen. A star appears near the moon. Then another star appears. Sam counts them, but there are too many. He tells Dad that the stars must be having a party. Dad says it is time for Sam to sleep. Sam does not want to miss the party. He puts his toy bear by the window so the bear can watch it for him. In bed, Sam thinks about the cloud. Tomorrow, he will draw the moon and a cloud playing hide-and-seek. The bear stays awake by the window, or at least Sam thinks it does.","Nora's brother is called Ivo. Ivo thinks the name Bird is very strange, but he likes the little fish. He helps Nora give it food every morning. They put only a small amount in the bowl. Bird swims to the top and eats. Then it swims around a green plant. Nora draws a picture of Bird. In the picture, the fish has large wings. Ivo laughs and draws a tiny bird with a fish tail next to it. Their mother puts both pictures on the wall. One afternoon, Ivo brings a friend home. He says, “Come and meet Bird.” The friend looks around the room for a cage. There is no cage. Ivo points to the bowl. His friend is surprised and then laughs. “Bird is a fish!” Nora says that names do not have to tell us everything. Her brother agrees. He thinks about calling his bicycle “Boat,” but Nora says that may be too confusing when they go to the park.","At school, Paul's friend takes a photo of the two shoes. Paul does not mind. He is not worried, because the shoes are both comfortable. In class, the teacher asks the children to name colors. Paul's friend points at his feet and says, “Black and white!” Everyone smiles. The teacher says that different things can work well together. At lunch, Paul looks at his shoes again. The white one is a little dirty now. The black one looks the same. His friend asks if he will wear two different shoes tomorrow. Paul says no. He likes a surprise, but he does not want to look for his shoes every morning. When he gets home, he puts each shoe beside its partner. Now there are two pairs on the floor. His little sister comes in and wants to try them. The shoes are too big for her. She walks three steps and stops. “How do you run in these?” she asks. Paul laughs and helps her take them off.","At the shop, Amir sees a row of real hats. There is a blue hat, a red hat, and one with little stars. He asks Dad if the shop has a green watermelon hat. The woman in the shop hears him and laughs. She says they sell fruit near the door, but they do not sell hats made of fruit. Amir points to his head. Dad has made him take off the watermelon skin, so there is nothing there. Amir explains his idea anyway. The woman gives him a paper bag for the fruit. On the bag, she draws a smiling watermelon with a hat. Amir likes the drawing. He takes the bag home and puts it on the table. His little sister sees it and asks if the watermelon can talk. Amir says, “Only when it has a phone.” Dad says it is time to wash their hands before lunch. Amir still wants to invent a real watermelon hat, but he decides to use paper next time.","Ana's parrot is called Pico. Pico knows only a few words, but he says them at funny times. When Ana's friend arrives, Pico says, “No!” Her friend thinks the bird does not like her. Ana explains that Pico says no to almost everyone. She gives her friend a chair and they draw pictures together. Pico watches from his cage. Ana draws an apple. Her friend draws a big tree with many apples. Pico looks at the pictures and says, “No!” Then he takes a piece of apple from his dish. The girls laugh. In the evening, Ana's father helps clean the cage. Pico says “Good morning!” again, even though it is evening. Father says, “Good evening, Pico.” Pico looks at him and says nothing. Ana writes the words “good evening” on a card and puts it near the cage. She hopes Pico will learn the new words. The next morning, he looks at the card and says, “No!”","Ema's little brother is called Téo. He is only four. He wanted to help her pack her school bag. He saw many socks on the bed and thought they were important for school. He put them all inside. Ema tells him that her books are more useful in class. Téo says socks are useful too, especially when it is cold. Ema agrees, but she needs only two socks, not ten. Their mother listens and helps Téo count them. One, two, three, four, five pairs! They put four pairs in a drawer. Ema puts one pair beside her shoes for tomorrow. Then she checks her bag: a book, paper, pencils, and her lunch. Téo watches carefully. He wants to help again in the morning. Ema says he can give her one pencil, but he cannot pack the whole bag. Téo nods. The next morning, he gives her a pencil and one very small sock. “For your pencil,” he says.","The farmer's name is Mr. Lee. He usually gets up when the rooster calls. Today he opens his eyes and sees bright light in the window. He jumps out of bed. “Oh, it is late!” he says. He puts on his boots and goes outside. The cows stand by the gate. They look at him, then at their empty food place. Mr. Lee brings their food and fresh water. The cows eat happily. He looks for the rooster and finds him under a tree, still asleep. Mr. Lee does not wake him. He thinks even a rooster can need a long rest. At noon, the rooster finally calls. The cows look up from their lunch. One cow makes a loud sound, as if she is laughing. Mr. Lee says, “Tomorrow, I will use my little clock.” He puts the clock near his bed. The rooster hears the clock ring the next morning and wakes up too. This time, the whole farm is early.","Sira looks at her shoe. There is a pink spot on it. She has a paper napkin and cleans the shoe. Her dog watches very carefully. He thinks the pink spot is something to eat, but Sira keeps him away from it. She puts the empty ice cream cup in a bin. Then she sits on a bench. She still has a little money, but she does not buy another ice cream. Instead, she gets a bottle of water for herself. She and the dog take a slow walk home. On the way, they see a friend with a blue ball. The dog wants to play. Sira throws the ball three times, and the dog brings it back every time. At home, Sira tells her mother about the ice cream and the shoe. Her mother laughs and says she can wash the shoe. Sira asks if they have strawberries in the kitchen. They do. She eats a few and says they taste even better than ice cream today.","The little bird is called Pip. Pip looks down from the high scarf and sees the green grass far below. He likes the view. Zaza walks slowly so he does not fall. Her friend, a zebra, comes over and sees the bird on the scarf. “Is that a new hat?” asks the zebra. Pip says, “No, it is a very tall chair!” Zaza laughs. The zebra wants a scarf too, but her neck is short. Zaza's friend makes a small scarf with the last piece of blue cloth. The zebra puts it on and looks in a pond. She likes it. Pip flies down to the pond for a drink. Zaza and the zebra talk about their new scarves. Pip comes back and lands on a tree. He says the tree is a better chair because it does not walk. Zaza says, “Thank you! I want my scarf to stay a scarf.” They all laugh, and Pip sings a short song from the tree.","Kai turns off the water while he brushes. His toothbrush is blue and has a little star on it. His sister has a green toothbrush. She asks if she can sing with him tomorrow. Kai says yes, but they need two microphones. Dad comes back with a small cup of water for each child. They rinse their mouths and put their toothbrushes away. Then they go to the kitchen for breakfast. Their mother asks why they are smiling so much. Kai sings the first line of his toothbrush song. His sister sings the next line. Dad puts his hands over his ears and makes a funny face. Mother laughs and says it is a good way to start the day. Kai eats bread and fruit. He tells his sister that tomorrow they can make a new song about washing hands. She says it must have a very short chorus. Dad says he is ready for a quiet song. Kai smiles. A quiet song may be a difficult challenge for him.","Ruby's brother watches from a bench. He has a red kite, but he is not flying it yet. He waits for Ruby to come back. When she reaches him, she tells him about the wind. He says the wind likes to take a little break, just like people do. Ruby asks him to fly his kite too. They stand far apart so the strings do not touch. The green kite goes up first. Then the red kite goes up. From below, they look like two small fish in a blue sea. A little girl walks by with her mother. She points at the kites and says one fish is red and one is green. Ruby likes that idea. Later, the wind gets weaker again. Both kites come down, but this time they land on the grass, not on the bench. Ruby and her brother roll up their strings and go home. Ruby says the kites need dinner. Her brother says kites only eat wind. They will have to wait until tomorrow.","The chicken is called Dot. She usually stays outside, but the door is open today. Nico's mother gives Dot a little bowl of water. Dot drinks it and walks around the kitchen. Nico's brother puts a small box on the floor with soft paper inside. “This can be your place,” he tells Dot. Dot looks at the box, but she goes back to the chair. Nico thinks she likes to sit high and see everyone. His mother says that a chicken belongs outside, where there is space and fresh air. Nico carries Dot carefully to the garden. His brother takes the box too. They put it under a small roof, where it will stay dry. Dot sits in the box at last. Nico finds the egg on the chair and gives it to his mother. She says she will cook it for lunch. At lunch, Nico looks at the empty chair and laughs. “Do we need to put a sign on it?” he asks. “For people only!”","Mia's friend is called Sal. Sal has many colored pencils in a small box. He offers Mia a red pencil and a green one. Mia draws a tree with green leaves. She puts a red apple in the tree. The yellow bird sits on a branch. The blue sun stays high in the sky. Sal asks if she will change the sun to yellow now. Mia says no. It is her special blue sun. The teacher asks the children to put their drawings on a table. Everyone walks around to look at them. One child has drawn a purple cat. Another has drawn a pink house. The teacher says art can show real things or things from our minds. Mia is happy. At home, she shows the picture to her father. He asks about the blue sun. Mia says it is a cool sun for a hot day. Her father puts the picture on the wall. The next morning, Mia takes all her pencils to school, including a yellow one.","Momo's friend is a little monkey named Lulu. Lulu gives him the banana because she knows it is his favorite fruit. After the game, Momo thanks her again. This time everyone is allowed to speak. The monkeys sit under a tree and share their snacks. Momo eats his banana. Lulu eats a mango. A bird sings above them. Momo asks if the bird could ever win the quiet game. Lulu says no, because the bird sings all day. The bird looks down and makes one loud sound, as if it agrees. They decide to play a new game. Each monkey must find one yellow thing. Momo points to his banana skin. Lulu points to a yellow flower. Another monkey points to the sun, but it is hard to bring the sun to the tree. Everyone laughs. At the end of the day, Momo goes home. He tells his mother that he lost a game and won a snack. She says that sounds like a very good day."],"fr":["Le chien entre dans le salon avec fierté. Il s’appelle Bobo et il aime porter des objets. Il ne sait pas qu’un chapeau se met sur la tête. Pour lui, c’est une petite maison douce. Milo le suit. Bobo passe sous la table, mais le chapeau est trop large. Il reste devant la table. Bobo est surpris. Milo s’assoit près du chapeau. Leur amie Nora rentre de l’école. Elle voit le chapeau rouge et les deux animaux. « C’est un nouveau jeu ? » demande-t-elle. Milo touche le chapeau avec une patte. Bobo le touche avec son nez. Nora met le chapeau sur sa tête. Il lui va bien. Elle voit le canapé, la cuisine et la chaise. « Ce chapeau est à moi », dit-elle avec un sourire. Bobo lui apporte une balle. Milo lui apporte une chaussette. Tout le monde veut offrir un cadeau à Nora. La chaise, bien sûr, ne donne rien. Elle a déjà eu assez de surprises pour aujourd’hui.","Le petit frère de Lina veut aussi essayer le téléphone fruit. Il prend une orange sur la table et dit : « Allô, Papi ! » Papi est dehors, dans le jardin. Il n’entend pas l’orange, mais il entend le garçon. Il entre et demande : « Qui m’appelle ? » Mamie montre l’orange. Tout le monde rit. Lina dit qu’un téléphone fruit ne marche pas longtemps. Son frère ne comprend pas. « Pourquoi ? » demande-t-il. Lina montre la peau de banane vide. « Mon téléphone ne marche plus. Je l’ai mangé ! » Mamie sort un vrai téléphone de sa poche. Elle montre une photo des fleurs de Papi. Il a beaucoup de fleurs rouges. Les enfants vont à la fenêtre pour les regarder. Puis Papi demande son orange. Il a faim. Le petit frère la lui donne et dit : « Ton ventre t’appelle. » Papi rit et partage l’orange avec les enfants.","Tom demande à la maîtresse si le nouvel élève peut rester près de lui. Elle dit que les grenouilles ne viennent pas souvent à l’école, mais que celle-ci peut rester jusqu’à midi. La classe apprend les nombres. Tom met trois crayons sur sa table. La grenouille saute par-dessus le premier, puis le deuxième, puis le troisième. « Un, deux, trois ! » disent les enfants. La grenouille ne compte pas, mais elle semble très contente. À la pause, Tom la porte dehors. Il y a un petit étang derrière l’école. La grenouille voit l’eau et saute dedans. Tom lui dit au revoir. L’après-midi, la maîtresse demande aux élèves de dessiner cette visite. Tom dessine une grenouille verte avec un très grand cartable. Son ami dessine une grenouille avec des lunettes. La maîtresse met les deux dessins au mur. Le lendemain matin, Tom regarde sa table. La grenouille n’est pas là. Il y a seulement une petite trace d’eau. Il sourit quand même.","Le chien s’appelle Pip. Pip aime les objets bleus. Il a une balle bleue et une couverture bleue. Aujourd’hui, il pense que la chaussette est un bonnet bleu. Omar dit : « Pip, une chaussette va sur mon pied, pas sur ta tête. » Pip court avec son nouveau bonnet. Omar le suit dans le salon. Sa sœur les voit et rit. Elle prend une photo. Sur la photo, Pip ressemble à un petit cuisinier avec un bonnet doux. Omar reprend enfin sa chaussette. Elle est propre, mais il y a des poils de chien dessus. Il la met près de l’autre chaussette. Pip apporte sa balle bleue à Omar. Il veut jouer avant le petit déjeuner. Omar a cinq minutes, alors ils jouent ensemble. Puis Omar s’habille. Sa sœur montre la photo drôle à leur mère. Maman dit : « Demain, cherche d’abord tes chaussettes sur Pip. » Pip bouge la queue. Il ne comprend pas, mais il aime toute cette attention.","Le petit frère d’Ava arrive à table. Il veut mettre une pomme sur sa pizza. Papa dit : « Une seule nouvelle idée à la fois, s’il te plaît. » Le garçon mange sa part avec seulement du fromage. Maman fait du pain grillé et s’assoit avec eux. Elle demande à Ava pourquoi elle aime la banane sur la pizza. Ava dit que la banane est douce et sucrée. La tomate est douce aussi, mais elle n’est pas sucrée. Elle aime les deux goûts ensemble. Papa coupe une toute petite part pour maman. Maman goûte. Elle fait une drôle de tête, puis mange encore un peu. « C’est intéressant », dit-elle. Tout le monde sait que cela ne veut pas dire « J’adore ». Après le petit déjeuner, la famille nettoie la table. Ava écrit « pizza à la banane » sur un papier. Elle le met sur le frigo. Son frère écrit « pizza à la pomme » dessous. Papa lit les deux idées. Samedi prochain, il va peut-être faire des œufs.","Près de l’étang, la maman canard regarde ses petits. Il y en a quatre. Un petit canard est très petit et marche lentement. Nina les compte avec son doigt. Léo met son vélo près d’un arbre pour laisser beaucoup de place aux canards. Deux autres enfants arrivent sur le chemin. Ils veulent aller vite aussi. Nina leur demande d’attendre. Les enfants s’arrêtent et regardent les canards. Le plus petit suit sa maman et arrive enfin à l’eau. Tout le monde sourit. Léo dit : « C’est la course la plus lente du monde. » Nina dit : « Oui, et je l’aime bien. » Ils reprennent leurs vélos. Cette fois, ils ne font pas la course. Ils roulent côte à côte et parlent des canards. À la maison, Nina raconte à son père qu’elle a perdu une course contre des canards. Son père rit et demande une photo. Nina n’a pas de photo, mais elle peut lui dessiner quatre petits canards et un grand canard.","La pluie est légère. Ben et ses amis restent sous le parapluie. Ils entendent les petites gouttes au-dessus de leurs têtes. Un ami dit que cela ressemble à de petits pas. Une autre amie dit que cela ressemble à du maïs qui saute. Ben dit que cela ressemble à la pluie, et tous rient. Une dame passe sans parapluie. Les enfants se rapprochent et lui font une place. Elle les remercie. Après quelques minutes, le nuage s’en va. Le soleil revient et le parapluie donne encore de l’ombre. « Ton parapluie a deux rôles aujourd’hui », dit la dame. Ben est content. Il rentre avec le parapluie fermé. À la maison, sa sœur lui demande s’il est allé nager. Ses chaussures sont mouillées, mais ses vêtements sont secs. Il lui parle du soleil, de la pluie et de leur nouvelle amie. Sa sœur veut prendre le parapluie demain. Ben dit oui, si elle le rapporte à la maison.","L’amie de Titi s’appelle Lili. Lili a un petit jardin près de l’arbre. Elle fait pousser des feuilles vertes et de petites fleurs jaunes. Titi apporte une fleur rouge en cadeau. Elle l’a portée toute la matinée ; la fleur est donc un peu fatiguée aussi. Lili la met dans un verre d’eau. Puis les deux amies déjeunent. Elles mangent des feuilles lentement et racontent des histoires. Titi dit qu’elle a vu un lapin rapide sur la route. Il est passé devant elle en une seconde. Lili dit qu’elle a vu le même lapin trois fois ce matin. « Il court vite, mais il ne sait pas où aller », dit-elle. L’après-midi, Titi et Lili s’assoient à l’ombre. Le lapin passe encore. « Bonjour ! » disent-elles. Il s’arrête, surpris de les voir ensemble. Il demande s’il est en retard. Lili dit : « Non. Assieds-toi. Nous avons le temps. » Même le lapin reste calme un moment.","La sœur de Jo regarde le chat. Il s’appelle Citrouille, mais il n’est pas orange. Il est blanc avec une oreille noire. Citrouille reste tranquille et fait comme si de rien n’était. La sœur de Jo prend une cuillère propre et remet un peu de crème sur le gâteau. Il ne reste pas beaucoup de crème. Jo remet les bougies en place. Sa famille chante pour son anniversaire. Citrouille regarde les bougies, mais reste loin. Jo souffle les bougies. Son vœu est secret. Ils coupent le gâteau en petites parts. Jo donne la première part à sa sœur, car elle a fait le gâteau. Ses parents en mangent aussi. Citrouille reçoit de la nourriture pour chat, pas du gâteau. « Voici ton repas d’anniversaire », lui dit Jo. Après la fête, Jo dessine Citrouille avec un grand nez blanc. Il met le dessin sur le frigo. Sa sœur écrit la date sous le dessin. L’année prochaine, ils garderont le gâteau loin du chat.","Eli regarde l’eau. Ses chaussures vont lentement sur la rivière. Le poisson nage près d’une chaussure jaune. Une petite grenouille saute sur l’autre. « J’ai un bateau ! » dit la grenouille. Eli marche au bord de la rivière, mais il ne peut pas aller dans l’eau profonde. Son amie, un grand oiseau, vole au-dessus des chaussures. Elle se pose plus loin et attend. Il y a un petit pont là-bas. Les chaussures s’arrêtent près du pont. La grenouille saute sur une pierre, et le poisson pousse une chaussure vers Eli. Eli sort les deux chaussures de l’eau. Elles sont mouillées, mais encore jaune vif. Il remercie ses amis. Il met les chaussures au soleil pour les faire sécher. En attendant, il pose ses grands pieds sur l’herbe douce. « Je n’ai peut-être pas besoin de chaussures aujourd’hui », dit-il. La grenouille demande si elle peut prendre une chaussure comme bateau demain. Eli répond : « Oui, si tu la rapportes ! »","La sœur du lapin s’appelle Mimi. Mimi prend sa moitié de carotte et la lave dans un petit ruisseau. Le lapin lave aussi sa moitié. Ils s’assoient sous un arbre pour manger. Un oiseau arrive et demande ce que fait un roi carotte toute la journée. « Il trouve à manger », dit le lapin. « Et il partage », ajoute Mimi. L’oiseau n’aime pas les carottes, mais il aime cette histoire. Il va raconter aux autres oiseaux qu’il y a un roi avec une couronne de légume. Bientôt, deux souris arrivent. Elles veulent voir la couronne. Le lapin leur montre le haut de la carotte, avec ses feuilles vertes. Les souris rient. Maintenant, la couronne est toute petite. Le lapin la remet sur sa tête, mais elle tombe sur une oreille. Mimi dit : « Un petit roi peut être gentil. » Le lapin sourit. Demain, il cherchera un gros chou. Ce sera peut-être un meilleur chapeau, mais il le partagera aussi.","Dans la bibliothèque, Maya voit beaucoup de livres. Une dame à l’accueil demande si elle a besoin d’aide. Maya dit qu’elle veut une histoire drôle sur les animaux. La dame lui montre une étagère de petits livres. Maya choisit un livre sur une vache qui veut danser. Elle s’assoit près d’une fenêtre et lit la première page. La vache a quatre pieds et pas de chaussures. Maya rit doucement. Elle se rappelle qu’il faut parler doucement dans une bibliothèque. Après la lecture, elle met le livre dans son sac. Elle a une carte de bibliothèque et peut donc l’emporter à la maison. En sortant, elle voit encore le bus. Le chauffeur lui fait signe. Maya lui répond. Elle lui dit qu’elle a trouvé le bon endroit. À la maison, elle explique à son frère la différence : dans une librairie, on achète les livres ; dans une bibliothèque, on les emprunte. Son frère demande si une vache peut vraiment danser. Maya ouvre le livre et dit : « Cherchons la réponse ensemble. »","Papa apporte une chaise près de la fenêtre. Sam s’assoit dessus avec une couverture douce. La lune est ronde et brillante maintenant. Sam dit qu’elle ressemble à une assiette blanche dans le ciel. Papa dit que la lune change de forme dans le ciel. Certaines nuits, elle ressemble à un petit morceau d’assiette. Sam se demande qui utilise le reste de l’assiette. Papa sourit : il n’y a pas de cuisine dans le ciel. Une étoile apparaît près de la lune. Puis une autre arrive. Sam les compte, mais il y en a trop. Il dit à papa que les étoiles font une fête. Papa dit que Sam doit aller dormir. Sam ne veut pas manquer la fête. Il met son ours en peluche près de la fenêtre. L’ours peut regarder pour lui. Dans son lit, Sam pense au nuage. Demain, il dessinera la lune et un nuage qui jouent à cache-cache. L’ours reste près de la fenêtre toute la nuit. Sam pense qu’il regarde les étoiles.","Le frère de Nora s’appelle Ivo. Il trouve le nom Oiseau très étrange, mais il aime ce petit poisson. Il aide Nora à lui donner à manger chaque matin. Ils mettent seulement un peu de nourriture dans le bocal. Oiseau monte, mange, puis nage autour d’une plante verte. Nora dessine Oiseau. Sur son dessin, le poisson a de grandes ailes. Ivo rit et dessine un tout petit oiseau avec une queue de poisson. Leur mère met les deux dessins au mur. Un après-midi, Ivo invite un ami à la maison. Il dit : « Viens voir Oiseau. » L’ami cherche une cage dans la chambre. Il n’y a pas de cage. Ivo montre le bocal. Son ami est surpris, puis il rit. « Oiseau est un poisson ! » Nora dit qu’un nom ne dit pas toujours tout sur quelqu’un. Son frère est d’accord. Il veut appeler son vélo « Bateau », mais Nora pense que ce sera difficile à comprendre au parc.","À l’école, l’ami de Paul prend une photo des deux chaussures. Paul n’est pas inquiet, car les deux chaussures sont confortables. En classe, la maîtresse demande aux enfants de dire des couleurs. L’ami de Paul montre ses pieds et dit : « Noir et blanc ! » Tout le monde sourit. La maîtresse dit que deux choses différentes peuvent bien aller ensemble. À midi, Paul regarde encore ses chaussures. La blanche est un peu sale maintenant. La noire ne change pas. Son ami lui demande s’il portera encore deux chaussures différentes demain. Paul dit non. Il aime les surprises, mais il ne veut pas chercher ses chaussures chaque matin. À la maison, il met chaque chaussure près de sa paire. Il y a maintenant deux paires par terre. Sa petite sœur arrive et veut les essayer. Elles sont trop grandes pour elle. Elle fait trois pas et s’arrête. « Comment tu fais pour courir avec ça ? » demande-t-elle. Paul rit et l’aide à les enlever.","Au magasin, Amir voit beaucoup de vrais chapeaux. Il y a un chapeau bleu, un rouge et un avec de petites étoiles. Il demande à papa si le magasin a un chapeau pastèque vert. La dame du magasin l’entend et rit. Elle dit qu’ils vendent des fruits près de la porte, mais pas de chapeaux en fruits. Amir montre sa tête. Papa lui a demandé d’enlever la peau de pastèque, donc il n’a plus rien sur la tête. Il explique quand même son idée. La dame lui donne un sac en papier pour les fruits. Sur le sac, elle dessine une pastèque qui sourit avec un chapeau. Amir aime le dessin. Il emporte le sac et le met sur la table à la maison. Sa petite sœur le voit et demande si la pastèque peut parler. Amir dit : « Seulement si elle a un téléphone. » Papa dit qu’il faut se laver les mains avant le repas. Amir veut toujours créer un chapeau pastèque, mais la prochaine fois il prendra du papier.","Le perroquet d’Ana s’appelle Pico. Il connaît peu de mots, mais il les dit à des moments drôles. Quand l’amie d’Ana arrive, Pico dit : « Non ! » L’amie pense que l’oiseau ne l’aime pas. Ana explique que Pico dit non à presque tout le monde. Elle donne une chaise à son amie et elles dessinent ensemble. Pico les regarde de sa cage. Ana dessine une pomme. Son amie dessine un grand arbre avec beaucoup de pommes. Pico regarde les dessins et dit : « Non ! » Puis il mange un morceau de pomme dans son plat. Les filles rient. Le soir, le père d’Ana aide à nettoyer la cage. Pico dit encore : « Bonjour ! » Mais c’est le soir. Papa répond : « Bonsoir, Pico. » Pico le regarde et ne dit rien. Ana écrit le mot « bonsoir » sur une carte et la met près de la cage. Elle espère qu’il apprendra ce mot. Le lendemain matin, Pico regarde la carte et dit : « Non ! »","Le petit frère d’Ema s’appelle Téo. Il a seulement quatre ans. Il voulait l’aider à préparer son sac d’école. Il a vu beaucoup de chaussettes sur le lit et a pensé qu’elles étaient importantes pour l’école. Il les a toutes mises dans le sac. Ema lui explique que ses livres sont plus utiles en classe. Téo dit que les chaussettes sont utiles aussi, surtout quand il fait froid. Ema est d’accord, mais il lui faut deux chaussettes, pas dix. Leur mère les écoute et aide Téo à compter. Un, deux, trois, quatre, cinq paires ! Ils mettent quatre paires dans un tiroir. Ema met une paire près de ses chaussures pour demain. Puis elle regarde dans son sac : un livre, du papier, des crayons et son repas. Téo regarde bien. Il veut encore aider demain matin. Ema dit qu’il peut lui donner un crayon, mais pas préparer tout le sac. Téo dit oui. Le lendemain, il lui donne un crayon et une toute petite chaussette. « C’est pour ton crayon », dit-il.","Le fermier s’appelle monsieur Lee. D’habitude, il se lève quand le coq chante. Aujourd’hui, il ouvre les yeux et voit beaucoup de lumière à la fenêtre. Il sort vite de son lit. « Oh, il est tard ! » dit-il. Il met ses bottes et sort. Les vaches sont près de la porte. Elles le regardent, puis regardent leur place vide pour manger. Monsieur Lee apporte de la nourriture et de l’eau fraîche. Les vaches mangent avec plaisir. Il cherche le coq et le trouve sous un arbre. Il dort encore. Monsieur Lee ne le réveille pas. Il pense qu’un coq peut aussi avoir besoin de dormir longtemps. À midi, le coq chante enfin. Les vaches lèvent la tête. Une vache fait un grand bruit, comme si elle riait. Monsieur Lee dit : « Demain, je vais utiliser mon petit réveil. » Il met le réveil près de son lit. Le lendemain matin, le coq entend le réveil et se lève aussi. Cette fois, toute la ferme est en avance.","Sira regarde sa chaussure. Il y a une tache rose dessus. Elle a une serviette en papier et nettoie la chaussure. Son chien regarde avec attention. Il pense que la tache rose se mange, mais Sira ne le laisse pas y toucher. Elle met le pot vide de la glace dans une poubelle. Puis elle s’assoit sur un banc. Il lui reste un peu d’argent, mais elle n’achète pas une autre glace. Elle prend une bouteille d’eau pour elle. Elle et son chien rentrent lentement. Sur le chemin, ils voient un ami avec une balle bleue. Le chien veut jouer. Sira lance la balle trois fois, et le chien la rapporte chaque fois. À la maison, Sira raconte l’histoire de la glace et de sa chaussure à sa mère. Maman rit et dit qu’elle peut laver la chaussure. Sira demande s’il y a des fraises dans la cuisine. Oui, il y en a. Elle en mange quelques-unes et dit qu’elles sont encore meilleures que la glace aujourd’hui.","Le petit oiseau s’appelle Pip. Il regarde en bas depuis la haute écharpe. Il voit l’herbe verte très loin sous lui. Il aime la vue. Zaza marche lentement pour qu’il ne tombe pas. Son amie, une zèbre, arrive et voit l’oiseau sur l’écharpe. « C’est un nouveau chapeau ? » demande la zèbre. Pip dit : « Non, c’est une chaise très haute ! » Zaza rit. La zèbre veut aussi une écharpe, mais son cou est court. L’amie de Zaza fait une petite écharpe avec le dernier morceau
